name: Optimize Assets

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.webp"

permissions:
  contents: write

jobs:
  optimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y webp imagemagick
          npm install -g html-minifier-terser csso-cli terser

      - name: Convert images to WebP
        run: |
          find . -type f \( \
            -iname "*.jpg" \
            -o -iname "*.jpeg" \
            -o -iname "*.png" \
          \) | while read file; do

            output="${file%.*}.webp"

            width=$(identify -format "%w" "$file")
            height=$(identify -format "%h" "$file")

            MAX=1000

            if [ "$width" -le "$MAX" ] && [ "$height" -le "$MAX" ]; then
              cwebp -q 90 -m 6 -af "$file" -o "$output"
            else
              if [ "$width" -gt "$height" ]; then
                new_width=$MAX
                new_height=$(( height * MAX / width ))
              else
                new_height=$MAX
                new_width=$(( width * MAX / height ))
              fi

              cwebp \
                -q 90 \
                -m 6 \
                -af \
                -resize "$new_width" "$new_height" \
                "$file" \
                -o "$output"
            fi

            if [ -f "$output" ]; then
              echo "✓ Converted $file -> $output"
              rm "$file"
            else
              echo "✗ Failed to convert $file"
            fi

          done

      - name: Replace image references
        run: |
          find . -type f \( \
            -name "*.html" \
            -o -name "*.css" \
            -o -name "*.js" \
            -o -name "*.json" \
            -o -name "*.md" \
          \) \
          -exec sed -Ei \
          's/\.jpe?g([?#"]|'\''|\)| |$)/.webp\1/g;
           s/\.png([?#"]|'\''|\)| |$)/.webp\1/g' {} +

      - name: Minify HTML
        run: |
          find . -name "*.html" -exec \
          html-minifier-terser \
            --collapse-whitespace \
            --remove-comments \
            --remove-redundant-attributes \
            --remove-empty-attributes \
            --minify-css true \
            --case-sensitive \
            --use-short-doctype \
            --output {} {} \;

      - name: Minify CSS
        run: |
          find . -name "*.css" \
            -exec csso {} --output {} \;

      - name: Minify JavaScript
        run: |
          find . -name "*.js" \
            ! -path "./js/youtube-config.js" \
            ! -name "*.min.js" \
            -exec terser {} -o {} -c \;

      - name: Commit changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Optimize assets"
            git push
          fi