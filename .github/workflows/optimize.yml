name: Optimize Assets

on:
  push:
    branches: ["main"]
    paths-ignore:
      - '**/*.webp'

permissions:
  contents: write

jobs:
  optimize:
    if: github.actor != 'github-actions'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y webp imagemagick
          npm install -g html-minifier-terser csso-cli terser

      - name: Convert images to webp (cwebp, max 500px)
        run: |
          find . -type f \( -iname "*.jpg" -o -iname "*.png" \) | while read file; do
            output="${file%.*}.webp"

            # get dimensions
            width=$(identify -format "%w" "$file")
            height=$(identify -format "%h" "$file")

            max=500

            if [ "$width" -le "$max" ] && [ "$height" -le "$max" ]; then
              # no resize needed
              cwebp -q 95 -m 6 -af "$file" -o "$output"
            else
              # calculate scale while preserving aspect ratio
              if [ "$width" -gt "$height" ]; then
                new_width=$max
                new_height=$(( height * max / width ))
              else
                new_height=$max
                new_width=$(( width * max / height ))
              fi

              cwebp -q 95 -m 6 -af -resize $new_width $new_height "$file" -o "$output"
            fi

            if [ -f "$output" ]; then
              echo "Converted $file → $output"
              rm "$file"
            else
              echo "Conversion failed for $file"
            fi
          done

      - name: Replace image references
        run: |
          find . -type f \( -iname "*.html" -o -iname "*.css" -o -iname "*.js" \) \
          -exec sed -i 's/\.jpg/\.webp/g; s/\.png/\.webp/g' {} +

      - name: Minify HTML
        run: |
          find . -name "*.html" -exec html-minifier-terser \
            --collapse-whitespace \
            --remove-comments \
            --minify-css true \
            --minify-js true \
            -o {} {} \;

      - name: Minify CSS
        run: |
          find . -name "*.css" -exec csso {} --output {} \;

      - name: Minify JS
        run: |
          find . -name "*.js" -exec terser {} -o {} -c -m \;

      - name: Commit changes (only if needed)
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add .

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto optimize assets"
            git push
          fi
